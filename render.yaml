# Render Blueprint for the Django API. Render redeploys on every push to the
# connected branch (only when files under backend/ change).
# Setup: Render dashboard -> New -> Blueprint -> pick this GitHub repo.
services:
  - type: web
    name: truck-route-planner-api
    runtime: python
    plan: free
    rootDir: backend
    buildFilter:
      paths:
        - backend/**
    buildCommand: pip install -r requirements.txt
    # --timeout 90: one trip plan makes several third-party calls (25 s timeout each).
    startCommand: gunicorn trip_planner.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 90
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Your Vercel URL, e.g. https://weather-aware-truck-routing.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Optional: allow Vercel preview URLs, e.g. ^https://weather-aware-truck-routing-.*\.vercel\.app$
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        sync: false
      # OSRM/Nominatim usage policy: identify the app and a contact, e.g.
      # TruckSafeRoutePlanner/1.0 (you@example.com)
      - key: HTTP_USER_AGENT
        sync: false
      - key: ALLOW_MOCK_FALLBACK
        value: "true"
